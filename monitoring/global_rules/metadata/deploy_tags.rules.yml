groups:
  - name: deploy_tags
    rules: 
      - record: deploy_role_map
        labels:
          role: stable
        expr: >
          label_replace(
            consul_catalog_kv{key=~".*/status/.*/is_stable"},
            "version", "$1", "key", ".*status/(.*)/is_stable"
          )

      # Правило 2: Создаем метрику-карту "Кто сейчас Canary?"
      # Результат: deploy_role_map{role="canary", version="x9y8z7", service="db"} 1
      - record: deploy_role_map
        labels:
          role: canary
        expr: >
          label_replace(
            consul_catalog_kv{key=~".*/status/.*/is_canary"},
            "version", "$1", "key", ".*status/(.*)/is_canary"
          )