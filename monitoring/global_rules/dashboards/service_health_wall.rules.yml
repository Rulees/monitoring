# service_wall.rules.yml
# Assumptions:
# - Labels: project_name
# - node_exporter metrics present: node_cpu_seconds_total, node_memory_*, node_filesystem_*, up
#
# Severity scale:
# 1 OK, 2 WARN, 3 CRIT, 4 DOWN (UP==0 overrides everything)

groups:
  - name: service_health_wall
    interval: 30s
    rules:
      # -----------------------
      # RAW (колонки таблицы)
      # -----------------------

      - record: service_wall:cpu_pct
        expr: |
          max by (project_name) (
            100 - (
              avg by (project_name, instance) (
                rate(node_cpu_seconds_total{mode="idle"}[5m])
              ) * 100
            )
          )

      - record: service_wall:mem_pct
        expr: |
          max by (project_name) (
            (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100
          )

      - record: service_wall:disk_free_pct
        expr: |
          min by (project_name) (
            (
              node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay|squashfs"}
              /
              node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay|squashfs"}
            ) * 100
          )

      # "Хоть один упал" => DOWN (берём min)
      - record: service_wall:up
        expr: |
          min by (project_name) (up)

      # -----------------------
      # SEVERITY per metric (1/2/3 + DOWN=4)
      # -----------------------

      - record: service_wall:sev_cpu
        expr: |
          max by (project_name) (
            1 + (service_wall:cpu_pct >= bool 70) + (service_wall:cpu_pct >= bool 85)
          )

      - record: service_wall:sev_mem
        expr: |
          max by (project_name) (
            1 + (service_wall:mem_pct >= bool 70) + (service_wall:mem_pct >= bool 85)
          )

      - record: service_wall:sev_disk
        expr: |
          max by (project_name) (
            1 + (service_wall:disk_free_pct < bool 20) + (service_wall:disk_free_pct < bool 10)
          )

      # DOWN overrides: up==0 -> 4, else 0
      - record: service_wall:sev_up
        expr: |
          max by (project_name) (
            (service_wall:up == bool 0) * 4
          )

      # -----------------------
      # STATUS + EFFECTIVE
      # -----------------------

      - record: service_wall:status
        expr: |
          max by (project_name) (
            service_wall:sev_cpu
            or service_wall:sev_mem
            or service_wall:sev_disk
            or service_wall:sev_up
          )

      # effective для сортировки. Так как весов окружений (prod/dev) больше нет, просто дублируем status
      - record: service_wall:effective
        expr: |
          service_wall:status

      # -----------------------
      # INSTANCE-level для N/BAD
      # -----------------------

      - record: service_wall:cpu_pct_i
        expr: |
          100 * (1 - avg by (project_name, instance) (
            rate(node_cpu_seconds_total{mode="idle"}[5m])
          ))

      - record: service_wall:mem_pct_i
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100

      - record: service_wall:disk_free_pct_i
        expr: |
          min by (project_name, instance) (
            (
              node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay|squashfs"}
              /
              node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay|squashfs"}
            ) * 100
          )

      - record: service_wall:up_i
        expr: |
          up

      - record: service_wall:sev_cpu_i
        expr: |
          max by (project_name, instance) (
            1 + (service_wall:cpu_pct_i >= bool 70) + (service_wall:cpu_pct_i >= bool 85)
          )

      - record: service_wall:sev_mem_i
        expr: |
          max by (project_name, instance) (
            1 + (service_wall:mem_pct_i >= bool 70) + (service_wall:mem_pct_i >= bool 85)
          )

      - record: service_wall:sev_disk_i
        expr: |
          max by (project_name, instance) (
            1 + (service_wall:disk_free_pct_i < bool 20) + (service_wall:disk_free_pct_i < bool 10)
          )

      - record: service_wall:sev_up_i
        expr: |
          max by (project_name, instance) (
            (service_wall:up_i == bool 0) * 4
          )

      - record: service_wall:status_i
        expr: |
          max by (project_name, instance) (
            service_wall:sev_cpu_i
            or service_wall:sev_mem_i
            or service_wall:sev_disk_i
            or service_wall:sev_up_i
          )

      # N = сколько инстансов всего
      - record: service_wall:n
        expr: |
          count by (project_name) (service_wall:up_i)

      # BAD = сколько инстансов где status>=2 (WARN/CRIT/DOWN)
      - record: service_wall:bad
        expr: |
          sum by (project_name) (service_wall:status_i >= bool 2)