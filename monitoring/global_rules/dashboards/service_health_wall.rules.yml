# service_wall.rules.yml
# Assumptions:
# - Labels: env, app, service, version
# - env="prod": version="stable|canary"
# - env="dev": version label отсутствует -> мы принудительно создаём version="dev"
# - node_exporter metrics present: node_cpu_seconds_total, node_memory_*, node_filesystem_*, up
#
# Severity scale:
# 1 OK, 2 WARN, 3 CRIT, 4 DOWN (UP==0 overrides everything)

groups:
  - name: service_health_wall
    interval: 30s
    rules:
      # -----------------------
      # RAW (колонки таблицы)
      # -----------------------

      - record: service_wall:cpu_pct
        expr: |
          (
            max by (env, app, service, version) (
              100 - (
                avg by (env, app, service, version, instance) (
                  rate(node_cpu_seconds_total{mode="idle", env="prod"}[5m])
                ) * 100
              )
            )
            * on(version) group_left(role)
            (deploy_role_map{role=~"stable|canary"} == 1)
          )
          or
          (
            label_replace(
              max by (env, app, service) (
                100 - (
                  avg by (env, app, service, instance) (
                    rate(node_cpu_seconds_total{mode="idle", env="dev"}[5m])
                  ) * 100
                )
              ),
              "version", "dev", "env", "dev"
            )
          )

      - record: service_wall:mem_pct
        expr: |
          (
            max by (env, app, service, version) (
              (1 - (node_memory_MemAvailable_bytes{env="prod"} / node_memory_MemTotal_bytes{env="prod"})) * 100
            )
            * on(version) group_left(role)
            (deploy_role_map{role=~"stable|canary"} == 1)
          )
          or
          (
            label_replace(
              max by (env, app, service) (
                (1 - (node_memory_MemAvailable_bytes{env="dev"} / node_memory_MemTotal_bytes{env="dev"})) * 100
              ),
              "version", "dev", "env", "dev"
            )
          )

      - record: service_wall:disk_free_pct
        expr: |
          (
            min by (env, app, service, version) (
              (
                node_filesystem_avail_bytes{env="prod", mountpoint="/", fstype!~"tmpfs|overlay|squashfs"}
                /
                node_filesystem_size_bytes{env="prod", mountpoint="/", fstype!~"tmpfs|overlay|squashfs"}
              ) * 100
            )
            * on(version) group_left(role)
            (deploy_role_map{role=~"stable|canary"} == 1)
          )
          or
          (
            label_replace(
              min by (env, app, service) (
                (
                  node_filesystem_avail_bytes{env="dev", mountpoint="/", fstype!~"tmpfs|overlay|squashfs"}
                  /
                  node_filesystem_size_bytes{env="dev", mountpoint="/", fstype!~"tmpfs|overlay|squashfs"}
                ) * 100
              ),
              "version", "dev", "env", "dev"
            )
          )

      # "Хоть один упал" => DOWN (берём min)
      - record: service_wall:up
        expr: |
          (
            min by (env, app, service, version) (up{env="prod"})
            * on(version) group_left(role)
            (deploy_role_map{role=~"stable|canary"} == 1)
          )
          or
          (
            label_replace(
              min by (env, app, service) (up{env="dev"}),
              "version", "dev", "env", "dev"
            )
          )

      # Вес окружения: prod=3, dev=1 (не зависит от наличия canary/stable)
      - record: service_wall:env_weight
        expr: |
          (service_wall:up{env="prod"} * 0 + 3)
          or
          (service_wall:up{env="dev"} * 0 + 1)

      # -----------------------
      # SEVERITY per metric (1/2/3 + DOWN=4)
      # -----------------------

      - record: service_wall:sev_cpu
        expr: |
          max by (env, app, service, version) (
            1 + (service_wall:cpu_pct >= bool 70) + (service_wall:cpu_pct >= bool 85)
          )

      - record: service_wall:sev_mem
        expr: |
          max by (env, app, service, version) (
            1 + (service_wall:mem_pct >= bool 70) + (service_wall:mem_pct >= bool 85)
          )

      - record: service_wall:sev_disk
        expr: |
          max by (env, app, service, version) (
            1 + (service_wall:disk_free_pct < bool 20) + (service_wall:disk_free_pct < bool 10)
          )

      # DOWN overrides: up==0 -> 4, else 0
      - record: service_wall:sev_up
        expr: |
          max by (env, app, service, version) (
            (service_wall:up == bool 0) * 4
          )

      # -----------------------
      # STATUS + EFFECTIVE
      # -----------------------

      - record: service_wall:status
        expr: |
          max by (env, app, service, version) (
            service_wall:sev_cpu
            or service_wall:sev_mem
            or service_wall:sev_disk
            or service_wall:sev_up
          )

      # effective для сортировки (prod важнее dev)
      - record: service_wall:effective
        expr: |
          max by (env, app, service, version) (
            service_wall:status * service_wall:env_weight
          )

      # -----------------------
      # INSTANCE-level для N/BAD
      # -----------------------

      - record: service_wall:cpu_pct_i
        expr: |
          (
            100 * (1 - avg by (env, app, service, version, instance) (
                rate(node_cpu_seconds_total{mode="idle", env="prod"}[5m])
              ))
            * on(version) group_left(role)
            (deploy_role_map{role=~"stable|canary"} == 1)
          )
          or
          (
            label_replace(
              100 * (1 - avg by (env, app, service, instance) (
                  rate(node_cpu_seconds_total{mode="idle", env="dev"}[5m])
                )),
              "version", "dev", "env", "dev"
            )
          )

      - record: service_wall:mem_pct_i
        expr: |
          (
            ((1 - (node_memory_MemAvailable_bytes{env="prod"} / node_memory_MemTotal_bytes{env="prod"})) * 100)
            * on(version) group_left(role)
            (deploy_role_map{role=~"stable|canary"} == 1)
          )
          or
          (
            label_replace(
              ((1 - (node_memory_MemAvailable_bytes{env="dev"} / node_memory_MemTotal_bytes{env="dev"})) * 100),
              "version", "dev", "env", "dev"
            )
          )

      - record: service_wall:disk_free_pct_i
        expr: |
          (
            min by (env, app, service, version, instance) (
              (
                node_filesystem_avail_bytes{env="prod", mountpoint="/", fstype!~"tmpfs|overlay|squashfs"}
                /
                node_filesystem_size_bytes{env="prod", mountpoint="/", fstype!~"tmpfs|overlay|squashfs"}
              ) * 100
            )
            * on(version) group_left(role)
            (deploy_role_map{role=~"stable|canary"} == 1)
          )
          or
          (
            label_replace(
              min by (env, app, service, instance) (
                (
                  node_filesystem_avail_bytes{env="dev", mountpoint="/", fstype!~"tmpfs|overlay|squashfs"}
                  /
                  node_filesystem_size_bytes{env="dev", mountpoint="/", fstype!~"tmpfs|overlay|squashfs"}
                ) * 100
              ),
              "version", "dev", "env", "dev"
            )
          )

      - record: service_wall:up_i
        expr: |
          (
            up{env="prod"}
            * on(version) group_left(role)
            (deploy_role_map{role=~"stable|canary"} == 1)
          )
          or
          (
            label_replace(up{env="dev"}, "version", "dev", "env", "dev")
          )

      - record: service_wall:sev_cpu_i
        expr: |
          max by (env, app, service, version, instance) (
            1 + (service_wall:cpu_pct_i >= bool 70) + (service_wall:cpu_pct_i >= bool 85)
          )

      - record: service_wall:sev_mem_i
        expr: |
          max by (env, app, service, version, instance) (
            1 + (service_wall:mem_pct_i >= bool 70) + (service_wall:mem_pct_i >= bool 85)
          )

      - record: service_wall:sev_disk_i
        expr: |
          max by (env, app, service, version, instance) (
            1 + (service_wall:disk_free_pct_i < bool 20) + (service_wall:disk_free_pct_i < bool 10)
          )

      - record: service_wall:sev_up_i
        expr: |
          max by (env, app, service, version, instance) (
            (service_wall:up_i == bool 0) * 4
          )

      - record: service_wall:status_i
        expr: |
          max by (env, app, service, version, instance) (
            service_wall:sev_cpu_i
            or service_wall:sev_mem_i
            or service_wall:sev_disk_i
            or service_wall:sev_up_i
          )

      # N = сколько инстансов всего
      - record: service_wall:n
        expr: |
          count by (env, app, service, version) (service_wall:up_i)

      # BAD = сколько инстансов где status>=2 (WARN/CRIT/DOWN)
      - record: service_wall:bad
        expr: |
          sum by (env, app, service, version) (service_wall:status_i >= bool 2)
