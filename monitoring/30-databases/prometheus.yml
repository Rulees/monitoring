# файл не должен содержать ни одного пропуска в начале строк. или error "unmarshal"

global:
  scrape_interval: 10s

rule_files:
  - "/etc/prometheus/rules/*.yml"


alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - '127.0.0.1:9093'



##########################################################################################
##
# 1. СБОР МЕТРИК С СЕРВЕРОВ
##

scrape_configs:
  - job_name: 'projects'
    static_configs:

      # monitoring_server
      - targets: ['127.0.0.1:9100']
        labels:
          project_name: 'monitoring_server'

      # test
      - targets: ['111.88.244.44:9100']
        labels:
          project_name: 'test'

      # asepta
      - targets: ['<IP>:9100']
        labels:
          project_name: 'asepta'

      # cmb
      - targets: ['<IP>:9100']
        labels:
          project_name: 'cmb'



#############################################################


##
# 2. SSL + PORTS: Мониторинг дней до истечения SSL сертификата. + Доступности портов 80/443..
##

  - job_name: "blackbox"
    metrics_path: /probe
    params:
      module: [http_2xx]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
    static_configs:
      - targets:
          - https://test.lotsmen.ru
          - https://asepta.ru
          - https://cmb.ru


##
# 3. DOMAINS: Мониторинг дней до истечения регистрации домена
##

  - job_name: "domains"
    # scrape_interval: 10m
    metrics_path: /metrics
    static_configs:
      - targets:
        - 127.0.0.1:9222
