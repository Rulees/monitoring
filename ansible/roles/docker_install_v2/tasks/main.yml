- name: Prevent locks(работает иногда)
  block:
      - name: Останавливаем unattended-upgrades, чтобы он не держал локи
        systemd:
          name: unattended-upgrades
          state: stopped
          enabled: no
        ignore_errors: true
        become: yes




- name: Check if Docker is already installed
  command: docker --version
  register: docker_installed
  ignore_errors: yes
  changed_when: false




- name: Install Docker
  block:
      - name: Install aptitude
        apt:
          name: aptitude
          state: latest
          update_cache: true
        when:
          - docker_installed.rc != 0

      - name: Install required system packages
        apt:
          pkg:
            - ca-certificates
            - curl
            - gnupg
            - software-properties-common
            - python3-pip
            - python3-venv
            - python3-setuptools
          state: latest
          update_cache: true
        when:
          - docker_installed.rc != 0



      - name: Create keyrings directory
        file:
          path: /etc/apt/keyrings
          state: directory
          mode: '0755'
        when:
          - docker_installed.rc != 0

      - name: Download Docker GPG key
        get_url:
          url: https://download.docker.com/linux/ubuntu/gpg
          dest: /etc/apt/keyrings/docker.asc
          mode: '0644'
          force: true
        when:
          - docker_installed.rc != 0

      - name: De-armor Docker GPG key for APT
        command: gpg --dearmor --yes --output /etc/apt/keyrings/docker.gpg /etc/apt/keyrings/docker.asc
        args:
          creates: /etc/apt/keyrings/docker.gpg
        when:
          - docker_installed.rc != 0

      - name: Add Docker repository
        apt_repository:
          repo: "deb [signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
          state: present
          filename: docker
        when:
          - docker_installed.rc != 0

      - name: Update apt and install Docker Engine
        apt:
          pkg:
            - docker-ce
            - docker-ce-cli
            - containerd.io
            - docker-buildx-plugin
            - docker-compose-plugin
          state: latest
          update_cache: true
        when:
          - docker_installed.rc != 0

      - name: Install Docker Module for Python
        pip:
          name: docker
        when:
          - docker_installed.rc != 0











- name: Launch Docker
  block:
      - name: Запустить Docker (Debian)
        systemd:
          name: docker
          state: started
          enabled: yes
        when: ansible_os_family == "Debian"

      - name: Запустить Docker (RedHat)
        service:
          name: docker
          state: started
          enabled: yes
        when: ansible_os_family == "RedHat"

- name: Убедиться, что группа 'docker' существует
  group:
    name: docker
    state: present
    system: true
  when: docker_installed.rc == 0

- name: Добавить пользователя в группу Docker
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: yes
